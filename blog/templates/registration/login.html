<h1>Iniciar sesión</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
<p>¿No tenés cuenta? <a href="{% url 'blog:register' %}{% if next %}?next={{ next }}{% endif %}">Registrate</a></p>
