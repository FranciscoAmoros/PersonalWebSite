



{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="{% static 'portfolio/css/styles.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/css/add_comment.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container-fluid">

        <header class="navbar navbar-expand-lg bg-dark navbar-dark px-4 py-3">
            <div class="container">
                <p class="navbar-brand fw-bold mb-0">Francisco Amorós</p>
                <nav>
                    <ul class="nav">

                        <li class="nav-item"><a class="nav-link" href="{% url 'portfolio_home' %}">Portfolio</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'blog:post_list' %}">Blog</a></li>

                        <li class="nav-item ms-3">
                            <button id="theme-toggle" class="btn p-0 border-0 bg-transparent">
                                ☀️
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="comentar-main">

          <h1>Comentar en "{{ post.title }}"</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Publicar</button>
          </form>
          <a href="{{ post.get_absolute_url }}">Cancelar</a>


        </main>

        <footer class="bg-dark text-white text-center py-4">
            <div class="container">
                <p class="mb-1 fw-bold">Francisco Amorós</p>
                <p class="mb-2 text-secondary">
                    Desarrollador Junior | Inicio de sesión
                </p>

                <p class="mb-0 text-secondary">
                    © 2026 Francisco Amorós. Todos los derechos reservados.
                </p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'portfolio/js/main.js' %}"></script>

    </div>
</body>

</html>
